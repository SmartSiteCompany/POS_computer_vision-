<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administración de Usuarios</title>
    <link rel="stylesheet" href="crud.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>

  <div id="updateModal" class="modal" style="display: none">
    <div class="modal-content">
      <h3>Actualizar Fecha de Registro</h3>
      <input type="datetime-local" id="newDateInput" />
      <div style="margin-top: 10px">
        <button class="btn btn-success" onclick="confirmUpdate()">
          Actualizar
        </button>
        <button class="btn btn-secondary" onclick="closeModal()">
          Cancelar
        </button>
      </div>
    </div>
  </div>

  <body>
    <div class="container">
      <header class="header">
        <h1>
          <i class="fas fa-users-cog"></i> Administración de Cajeros Smart Site
          Company
        </h1>
        <button class="btn btn-primary" onclick="loadCajeros()">
          <i class="fas fa-sync-alt"></i> Cargar Cajeros
        </button>

        <a href="index.html" class="btn btn-primary">
          <i class="fas fa-arrow-left"></i> Volver al Inicio
        </a>
      </header>
      <div class="card table-container">
        <h2><i class="fas fa-list"></i> Lista de Cajeros</h2>
        <table id="usersTable" class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Fecha/Hora de Registro</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <footer class="footer">
      <p>© 2025 Smart Site Company. Todos los derechos reservados.</p>
    </footer>
    <script src="crudCajeros.js"></script>
  </body>
</html>
