<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Registro Facial Cajero</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="register.css" />
    <style>
      .video-container {
        position: relative;
        display: inline-block;
      }

      #video,
      #overlay {
        width: 640px;
        height: 480px;
        border-radius: 10px;
        border: 2px solid #ccc;
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
      }

      .btn-group {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1><i class="fas fa-user-lock"></i> Registro de Cajeros</h1>
        <p>Captura el rostro del cajero mediante cámara</p>
      </header>

      <div class="video-container">
        <video id="video" autoplay muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="btn-group">
        <button onclick="registerCajero()" class="btn btn-primary">
          <i class="fas fa-save"></i> Registrar Cajero
        </button>
        <a href="login.html" class="btn btn-secondary">
          <i class="fas fa-arrow-left"></i> Iniciar Sesión
        </a>
      </div>
    </div>

    <footer>
      <p>© 2025 Smart Site Company. Todos los derechos reservados.</p>
    </footer>

    <script src="registerCajero.js"></script>
  </body>
</html>
