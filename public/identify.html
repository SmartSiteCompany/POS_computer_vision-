<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Identificación Facial</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="identify.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          <i class="fas fa-user-circle"></i> Sistema de Identificación Facial Smart
          Site Company
        </h1>
        <p>Reconocimiento facial Smart Site Company</p>
      </header>

      <div class="tabs">
        <button class="tab-btn active" data-tab="real-time-tab">
          <i class="fas fa-video"></i> Detección en Tiempo Real
        </button>
        <button class="tab-btn" data-tab="image-tab">
          <i class="fas fa-image"></i> Identificación por Imagen
        </button>
      </div>

      <div id="real-time-tab" class="tab-content active">
        <div class="video-container">
          <video id="video" autoplay muted playsinline></video>
          <canvas id="overlay"></canvas>
        </div>

        <div id="results">
          <p class="status-message">Sistema listo. Iniciando cámara...</p>
        </div>

        <div class="btn-group">
          <button id="start-btn" class="btn btn-primary pulse">
            <i class="fas fa-play"></i> Iniciar Detección
          </button>
          <button id="stop-btn" class="btn btn-primary" disabled>
            <i class="fas fa-stop"></i> Detener Proceso
          </button>
          <a href="index.html" class="btn btn-primary">
            <i class="fas fa-arrow-left"></i> Volver al Inicio
          </a>
        </div>
      </div>

      <div id="image-tab" class="tab-content">
        <form id="upload-form" method="POST" enctype="multipart/form-data">
          <div class="form-group file-upload-wrapper">
            <label class="file-upload-label btn btn-primary">
              <i class="fas fa-upload"></i> Seleccionar Imagen
              <input
                type="file"
                name="image"
                accept="image/*"
                class="file-input"
                required
              />
            </label>
            <span id="file-name" class="file-name"></span>
          </div>

          <div class="btn-group">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-search"></i> Identificar Persona
            </button>
            <button id="clear-btn" type="button" class="btn btn-primary">
              <i class="fas fa-trash"></i> Limpiar Pantalla
            </button>
            <a href="index.html" class="btn btn-primary">
              <i class="fas fa-arrow-left"></i> Volver al Inicio
            </a>
          </div>
        </form>

        <div id="upload-result">
          <p class="status-message">Seleccione una imagen para analizar</p>
        </div>

        <div class="image-preview-container">
          <img id="preview" />
        </div>

        <ul id="upload-list" class="result-list"></ul>
      </div>
    </div>

    <footer>
      <p>© 2025 Smart Site Company. Todos los derechos reservados.</p>
    </footer>

    <script>
      // Script para manejar las pestañas
      document.addEventListener("DOMContentLoaded", function () {
        const tabBtns = document.querySelectorAll(".tab-btn");

        tabBtns.forEach((btn) => {
          btn.addEventListener("click", function () {
            const tabId = this.getAttribute("data-tab");

            // Remover clase active de todos los botones y contenidos
            document
              .querySelectorAll(".tab-btn")
              .forEach((b) => b.classList.remove("active"));
            document
              .querySelectorAll(".tab-content")
              .forEach((c) => c.classList.remove("active"));

            // Agregar clase active al botón y contenido seleccionado
            this.classList.add("active");
            document.getElementById(tabId).classList.add("active");
          });
        });

        // Mostrar vista previa de la imagen seleccionada
        const fileInput = document.querySelector(".file-input");
        if (fileInput) {
          fileInput.addEventListener("change", function (e) {
            const file = e.target.files[0];
            if (file) {
              document.getElementById("file-name").textContent = file.name;
              const reader = new FileReader();
              reader.onload = function (event) {
                const preview = document.getElementById("preview");
                preview.src = event.target.result;
                preview.style.display = "block";
              };
              reader.readAsDataURL(file);
            }
          });
        }

        // Funcionalidad original
        document
          .getElementById("start-btn")
          .addEventListener("click", function () {
            startIdentification();
            this.disabled = true;
            document.getElementById("stop-btn").disabled = false;
            this.classList.add("active");
          });

        document
          .getElementById("stop-btn")
          .addEventListener("click", function () {
            stopIdentification();
            this.disabled = true;
            document.getElementById("start-btn").disabled = false;
            document.getElementById("start-btn").classList.remove("active");
          });

        function simulateProcessing(element) {
          element.innerHTML =
            '<span class="loading"></span> Procesando imagen...';
          setTimeout(() => {
            element.innerHTML =
              '<span class="status-badge status-success"><i class="fas fa-check-circle"></i> Identificación completada</span>';
          }, 2000);
        }

        document
          .getElementById("upload-form")
          .addEventListener("submit", function (e) {
            e.preventDefault();
            const resultElement = document.getElementById("upload-result");
            simulateProcessing(resultElement);
          });

        // Efectos para botones
        document.querySelectorAll(".btn").forEach((button) => {
          // Efecto de onda al hacer clic
          button.addEventListener("click", function (e) {
            if (this.classList.contains("file-input")) return;

            const x = e.clientX - e.target.getBoundingClientRect().left;
            const y = e.clientY - e.target.getBoundingClientRect().top;

            const ripple = document.createElement("span");
            ripple.classList.add("ripple");
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;

            this.appendChild(ripple);

            setTimeout(() => {
              ripple.remove();
            }, 1000);
          });

          // Efecto de hover
          button.addEventListener("mouseenter", () => {
            button.style.transform = "translateY(-3px)";
          });

          button.addEventListener("mouseleave", () => {
            button.style.transform = "translateY(0)";
          });
        });
      });
    </script>
    <script src="identify.js"></script>
    <script src="uploads.js"></script>
  </body>
</html>
